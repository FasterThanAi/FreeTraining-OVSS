# ============================================================
# SAM Zero-Shot Segmentation Pipeline — Configuration
# ============================================================

# Logging
log_level: INFO
log_file: outputs/logs/pipeline.log

# ── Step 1: SAM 3-Pass ──────────────────────────────────────
step1:
  sam_checkpoint: "models/sam_vit_h_4b8939.pth"   # download from Meta
  sam_model_type: "vit_h"                          # vit_h | vit_l | vit_b
  device: "cuda"                                   # cuda | cpu
  confidence_threshold: 0.25                       # min CLIP sim to label a patch
  text_encoder: "clip"                             # clip | glip
  # SAM automatic mask generator settings
  points_per_side: 32
  pred_iou_thresh: 0.86
  stability_score_thresh: 0.92
  min_mask_region_area: 100

# ── Step 2: Co-occurrence Matrix ────────────────────────────
step2:
  adjacency_method: "centroid_distance"   # centroid_distance | mask_overlap | bbox_iou
  adjacency_threshold: 150                # pixels (for centroid method)
  normalize: true

# ── Step 3: Preprocessing ───────────────────────────────────
step3:
  min_area: 300                   # pixels — remove smaller patches
  use_morphology: true
  morph_kernel_size: 3
  merge_iou_threshold: 0.25       # merge patches with overlap above this
  merge_max_iterations: 3

# ── Step 4: Contextual Clustering ───────────────────────────
step4:
  embedding_weight: 0.5           # visual similarity weight
  cooccurrence_weight: 0.3        # co-occurrence matrix weight
  neighbor_weight: 0.2            # spatial neighbor vote weight
  min_label_confidence: 0.05
  k_neighbors: 5
  fallback_label: "background"

# ── Step 5: Mask Fusion ──────────────────────────────────────
step5:
  conflict_resolution: "confidence"    # confidence | area | identified_priority
  background_label: "background"
  smooth_boundaries: true
